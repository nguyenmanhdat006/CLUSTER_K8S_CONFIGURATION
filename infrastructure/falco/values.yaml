driver:
  kind: modern_ebpf    # đổi thành "ebpf" nếu kernel < 5.8, kiểm tra bằng uname -r

tty: true

falco:
  json_output: true
  json_include_output_property: true

  # Loai bo bot nhieu tu chinh he thong giam sat, tranh Falco tu bao dong ve Prometheus/Grafana
  # se tinh chinh sau khi thay ty le canh bao gia

falcosidekick:
  enabled: false   # tam tat, bat sau neu can dinh tuyen canh bao ra Slack

metrics:
  enabled: true    # bat de Prometheus scrape duoc

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 400Mi   # chan cung, tranh lap lai su co RAM da gap