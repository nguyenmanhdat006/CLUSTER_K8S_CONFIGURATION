driver:
  kind: ebpf

hostPID: true
tty: true

falco:
  json_output: true
  json_include_output_property: true

falcosidekick:
  enabled: false

metrics:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    memory: 768Mi

mounts:
  volumes:
    - name: var-lib-etcd
      hostPath:
        path: /var/lib/etcd
    - name: root-ssh
      hostPath:
        path: /root/.ssh
    - name: user-ssh
      hostPath:
        path: /home/nguyendat/.ssh
  volumeMounts:
    - name: var-lib-etcd
      mountPath: /host/var/lib/etcd
      readOnly: true
    - name: root-ssh
      mountPath: /host/root/.ssh
      readOnly: true
    - name: user-ssh
      mountPath: /host/home/nguyendat/.ssh
      readOnly: true