driver:
  kind: modern_ebpf

hostPID: true
tty: true

falco:
  json_output: true
  json_include_output_property: true
  load_plugins: [k8saudit, json]
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config:
        maxEventSize: 262144
      open_params: "/host/var/log/kubernetes/audit.log"
    - name: json
      library_path: libjson.so
      init_config: ""

falcosidekick:
  enabled: true
  config:
    existingSecret: "falco-telegram-secret"
    telegram:
      minimumpriority: "critical"

metrics:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    memory: 768Mi

mounts:
  volumes:
    - name: var-lib-etcd
      hostPath:
        path: /var/lib/etcd
    - name: root-ssh
      hostPath:
        path: /root/.ssh
    - name: user-ssh
      hostPath:
        path: /home/nguyendat/.ssh
    - name: k8s-audit-log
      hostPath:
        path: /var/log/kubernetes
  volumeMounts:
    - name: var-lib-etcd
      mountPath: /host/var/lib/etcd
      readOnly: true
    - name: root-ssh
      mountPath: /host/root/.ssh
      readOnly: true
    - name: user-ssh
      mountPath: /host/home/nguyendat/.ssh
      readOnly: true
    - name: k8s-audit-log
      mountPath: /host/var/log/kubernetes
      readOnly: true

customRules:
  rules-host-audit.yaml: |-
    - rule: Sửa cấu hình control plane trên máy chủ
      desc: Phát hiện ghi vào /etc/kubernetes/manifests trên máy chủ, ngoài quy trình GitOps
      condition: open_write and fd.name startswith /etc/kubernetes/manifests
      output: "Ghi vao cau hinh control plane tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_persistence]

    - rule: Đụng chứng chỉ cụm trên máy chủ
      desc: Phát hiện ghi vào /etc/kubernetes/pki trên máy chủ
      condition: open_write and fd.name startswith /etc/kubernetes/pki
      output: "Ghi vao chung chi cum tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_credential_access]

    - rule: Đọc kubeconfig quản trị trên máy chủ
      desc: Phát hiện đọc /etc/kubernetes/admin.conf trên máy chủ
      condition: open_read and fd.name = /etc/kubernetes/admin.conf and not proc.name in (kubelet, kube-apiserver, etcd)
      output: "Doc kubeconfig quan tri tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_credential_access]

    - rule: Đụng dữ liệu etcd trên máy chủ
      desc: Phát hiện ghi vào /var/lib/etcd trên máy chủ, ngoài chính tiến trình etcd
      condition: open_write and fd.name startswith /var/lib/etcd and not proc.name = etcd
      output: "Ghi vao du lieu etcd tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_impact]

    - rule: Sửa quyền sudo trên máy chủ
      desc: Phát hiện ghi vào /etc/sudoers hoặc /etc/sudoers.d trên máy chủ
      condition: open_write and fd.name startswith /etc/sudoers
      output: "Ghi vao cau hinh sudo tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_privilege_escalation]

    - rule: Tạo hoặc xoá tài khoản trên máy chủ
      desc: Phát hiện ghi vào /etc/passwd trên máy chủ
      condition: open_write and fd.name = /etc/passwd
      output: "Ghi vao danh sach tai khoan tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_persistence]

    - rule: Đổi mật khẩu trên máy chủ
      desc: Phát hiện ghi vào /etc/shadow trên máy chủ
      condition: open_write and fd.name = /etc/shadow
      output: "Ghi vao tep mat khau tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_credential_access]

    - rule: Đổi nhóm quyền trên máy chủ
      desc: Phát hiện ghi vào /etc/group trên máy chủ
      condition: open_write and fd.name = /etc/group
      output: "Ghi vao danh sach nhom quyen tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: WARNING
      tags: [host, filesystem, mitre_privilege_escalation]

    - rule: Cài cắm khoá SSH trên máy chủ
      desc: Phát hiện ghi vào authorized_keys trên máy chủ
      condition: open_write and (fd.name startswith /root/.ssh or fd.name startswith /home/nguyendat/.ssh)
      output: "Ghi vao authorized_keys tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: CRITICAL
      tags: [host, filesystem, mitre_persistence]

    - rule: Nới lỏng chính sách SSH trên máy chủ
      desc: Phát hiện ghi vào /etc/ssh/sshd_config trên máy chủ
      condition: open_write and fd.name = /etc/ssh/sshd_config
      output: "Ghi vao cau hinh sshd tren may chu (file=%fd.name user=%user.name process=%proc.name pid=%proc.pid)"
      priority: WARNING
      tags: [host, filesystem, mitre_persistence]

  rules-k8s-audit.yaml: |-
    - rule: Xoa Secret qua API server
      desc: Phat hien xoa Secret trong Kubernetes
      condition: ka.verb=delete and ka.target.resource=secrets
      output: "Secret bi xoa (user=%ka.user.name secret=%ka.target.name namespace=%ka.target.namespace)"
      priority: CRITICAL
      source: k8s_audit
      tags: [k8s_audit]

    - rule: Exec vao pod qua kubectl
      desc: Phat hien kubectl exec vao container dang chay
      condition: ka.target.subresource=exec and ka.verb=create
      output: "Exec vao pod (user=%ka.user.name pod=%ka.target.name namespace=%ka.target.namespace)"
      priority: CRITICAL
      source: k8s_audit
      tags: [k8s_audit]