# infrastructure/monitoring/secret-alertmanager-telegram.example.yaml
#
# ĐÂY LÀ FILE MẪU — không chứa giá trị thật, an toàn để commit lên Git.
#
# Alertmanager đọc token qua "bot_token_file" (xem values.yaml, mục
# alertmanager.config.receivers), trỏ vào đường dẫn Secret này được mount vào,
# không phải qua biến môi trường như falcosidekick. Cơ chế mount do
# alertmanagerSpec.secrets đảm nhiệm — khai báo trong values.yaml.
#
# Tên key BẮT BUỘC là "token" — khớp với đường dẫn đã khai báo trong values.yaml:
#   bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-token/token
#                                                                          ^^^^^
#                                                                       ten key nay
#
# Cách dùng:
#   1. Copy file này thành secret-alertmanager-telegram.yaml
#      (đã bị .gitignore chặn commit)
#      cp infrastructure/monitoring/secret-alertmanager-telegram.example.yaml \
#         infrastructure/monitoring/secret-alertmanager-telegram.yaml
#   2. Sửa secret-alertmanager-telegram.yaml, điền token thật
#      (có thể dùng lại đúng bot Telegram đã tạo cho Falco — cùng token,
#      khác Secret vì khác namespace)
#   3. Apply thẳng vào cụm, KHÔNG qua Git:
#      kubectl apply -f infrastructure/monitoring/secret-alertmanager-telegram.yaml
#   4. Xác nhận Secret đã tạo:
#      kubectl -n monitoring get secret alertmanager-telegram-token
#   5. Xác nhận Alertmanager đọc được sau khi values.yaml đã sync:
#      kubectl -n monitoring exec -it <pod-alertmanager> -- \
#        cat /etc/alertmanager/secrets/alertmanager-telegram-token/token
#
# Lấy token: mở Telegram, tìm @BotFather, hoặc dùng lại bot đã tạo cho Falco —
# xem infrastructure/falco/README.md, mục Telegram, để nhớ lại cách lấy.
#
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-telegram-token
  namespace: monitoring
type: Opaque
stringData:
  token: "DIEN_BOT_TOKEN_THAT_VAO_DAY"