apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: security
      rules:
        - alert: AuthenticationFailureSpike
          expr: sum(rate(authentication_attempts{result="error"}[5m])) > 0.2
          for: 5m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "Số lần xác thực thất bại vào API server tăng cao"

        - alert: CertificateExpiringSoon
          expr: |
            apiserver_client_certificate_expiration_seconds_bucket{le="31104000"} > 0
          for: 1m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "[TEST] Có chứng chỉ API server sắp hết hạn (nguong tam thoi 360 ngay)"

        - alert: LoginFailureSpike
          expr: sum(rate(login_failed_total[5m])) > 0.05
          for: 1m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "[TEST] Số lần đăng nhập thất bại vào ứng dụng tăng đột biến (nguong tam thoi 0.05)"

        - alert: AuditEventSpike
          expr: sum(rate(apiserver_audit_event_total[5m])) > 0.5
          for: 1m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "[TEST] Số sự kiện audit tăng bất thường (nguong tam thoi 0.5) — tra /var/log/kubernetes/audit.log"