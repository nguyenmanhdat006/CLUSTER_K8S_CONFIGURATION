apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: security
      rules:
        - alert: AuthenticationFailureSpike
          expr: sum(rate(authentication_attempts{result="error"}[5m])) > 0.05
          for: 2m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "Số lần xác thực thất bại vào API server tăng cao"

        - alert: CertificateExpiringSoon
          expr: |
            apiserver_client_certificate_expiration_seconds_bucket{le="7.776e+06"} > 0
          for: 1h
          labels:
            category: security
            severity: warning
          annotations:
            summary: "Có chứng chỉ API server sẽ hết hạn trong 90 ngày tới"

        - alert: LoginFailureSpike
          expr: sum(rate(login_failed_total[5m])) > 0.05
          for: 2m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "Số lần đăng nhập thất bại vào ứng dụng tăng đột biến"

        - alert: AuditEventSpike
          expr: sum(rate(apiserver_audit_event_total[5m])) > 1
          for: 3m
          labels:
            category: security
            severity: warning
          annotations:
            summary: "Số sự kiện audit tăng bất thường — tra /var/log/kubernetes/audit.log để biết chi tiết ai đã làm gì"