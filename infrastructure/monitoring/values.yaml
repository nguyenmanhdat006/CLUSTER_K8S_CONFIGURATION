# values.yaml cho kube-prometheus-stack — cấu hình chuẩn, đầy đủ.
# Các thành phần (Prometheus, Grafana, Alertmanager, node-exporter,

# ---- Grafana ----
grafana:
  enabled: true
  adminPassword: "demo123456"
  service:
    type: NodePort
    nodePort: 30300
  env:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"

# ---- Prometheus ----
prometheus:
  enabled: true
  service:
    type: NodePort
    nodePort: 30090                  # vào Prometheus UI qua http://<node-ip>:30090
  prometheusSpec:
    retention: 15d                   # giữ mặc định 10 ngày
    retentionSize: 3GB
    # Bật để Prometheus tự nhận mọi ServiceMonitor/PodMonitor trong cluster,
    # kể cả cái không mang label của release này (tiện khi thêm app sau).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false  

# ---- Alertmanager ----
alertmanager:
  enabled: true
  service:
    type: NodePort
    nodePort: 30093                  # vào Alertmanager qua http://<node-ip>:30093
  alertmanagerSpec:
    secrets:
      - alertmanager-telegram-token   # Secret tạo tay, xem infrastructure/monitoring/secret-alertmanager-telegram.example.yaml
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "telegram"
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - category = "security"
          receiver: "telegram"
          group_wait: 0s              # bao mat gui ngay, khong cho gom nhom
        - matchers:
            - category = "performance"
          receiver: "telegram"
    receivers:
      - name: "null"
      - name: "telegram"
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-token/token
            chat_id: -5350831125
            parse_mode: "HTML"

# ---- Bộ thu thập số liệu ----
nodeExporter:
  enabled: true                      # DaemonSet — chạy trên MỌI node để lấy metrics từng máy
kubeStateMetrics:
  enabled: true

# ---- Điều chỉnh cho kubeadm ----
# Trên kubeadm, mấy control-plane component bind vào 127.0.0.1 nên Prometheus
# hay scrape lỗi. Đây là cấu hình chuẩn để chúng scrape được (không phải tắt đi).
kubeControllerManager:
  service:
    enabled: true
  serviceMonitor:
    https: true
    insecureSkipVerify: true
kubeScheduler:
  service:
    enabled: true
  serviceMonitor:
    https: true
    insecureSkipVerify: true
kubeProxy:
  enabled: true
kubeEtcd:
  enabled: true
