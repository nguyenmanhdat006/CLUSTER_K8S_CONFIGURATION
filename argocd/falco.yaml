apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: "9.1.0"
    helm:
      values: |
        driver:
          kind: modern_ebpf

        tty: true

        falco:
          json_output: true
          json_include_output_property: true

        falcosidekick:
          enabled: false

        metrics:
          enabled: true

        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            memory: 400Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true